<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe</h1>
    <p id="status" aria-live="polite">X's turn</p>

    <div class="board" role="grid" aria-label="Tic-Tac-Toe board">
      <button class="cell" aria-label="Row 1, column 1"></button>
      <button class="cell" aria-label="Row 1, column 2"></button>
      <button class="cell" aria-label="Row 1, column 3"></button>
      <button class="cell" aria-label="Row 2, column 1"></button>
      <button class="cell" aria-label="Row 2, column 2"></button>
      <button class="cell" aria-label="Row 2, column 3"></button>
      <button class="cell" aria-label="Row 3, column 1"></button>
      <button class="cell" aria-label="Row 3, column 2"></button>
      <button class="cell" aria-label="Row 3, column 3"></button>
    </div>

    <button id="restart">Restart game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
